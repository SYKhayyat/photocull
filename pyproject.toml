[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photocull"
version = "0.1.0"
description = "Measures where focus actually landed in your photographs, and shows its work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["photography", "culling", "sharpness", "focus", "raw", "exif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

# The core deliberately depends on nothing but numpy and Pillow. Everything that
# would pull in a heavier stack is an extra, and each one degrades to a named
# fallback rather than an import error.
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
faces = ["opencv-python-headless>=4.5.4"]
raw = ["rawpy>=0.18"]
dev = ["pytest>=7.4"]
all = ["opencv-python-headless>=4.5.4", "rawpy>=0.18", "pytest>=7.4"]

[project.scripts]
photocull = "photocull.cli:main"

[tool.setuptools.packages.find]
include = ["photocull*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
